<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send to Nib</title>
<style>
  body { margin: 0; width: 340px; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #FFFDF8; color: #2B2140; }
  h1 { margin: 0 0 8px; font-size: 16px; }
  .page { background: #FFF6E5; border: 1px solid #EBD3B0; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .page small { color: #6F6280; display: block; }
  blockquote { margin: 0 0 10px; padding: 8px 10px; border-left: 3px solid #FFC93C; background: rgba(255,201,60,.35); border-radius: 4px; max-height: 120px; overflow: auto; }
  input { width: 100%; box-sizing: border-box; min-height: 40px; padding: 6px 10px; border: 2px solid #D9BC93; border-radius: 10px; background: #FFF6E5; font: inherit; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid #D9BC93; background: #fff; font: inherit; cursor: pointer; }
  button.primary { background: #FF8FA3; border-color: #2B2140; font-weight: 700; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #msg { margin: 10px 0 0; min-height: 1.4em; font-weight: 600; }
  .err { color: #B3261E; } .ok { color: #1F8F63; }
</style>
</head>
<body>
  <h1>Send to Nib</h1>
  <div class="page"><strong id="title"></strong><small id="url"></small></div>
  <blockquote id="selection" hidden></blockquote>
  <input id="note" placeholder="Add a note (optional)" aria-label="Note">
  <input id="tags" placeholder="Tags, e.g. research, reading" aria-label="Tags">
  <div class="row">
    <button id="highlight" class="primary" disabled>Save highlight</button>
    <button id="bookmark">Bookmark page</button>
  </div>
  <p id="msg" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
