name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desk/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w @observe/desk
      # Compiles all of the Windows-only code (screen capture, OCR, secret storage, tray, updater).
      - name: Rust build check
        working-directory: apps/desk/src-tauri
        run: cargo check --locked

  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
